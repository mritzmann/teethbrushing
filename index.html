<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zahnputz">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<title>Zahnputz-Assistent</title>
<style>
  :root{
    --bg:#000000;
    --card:#1c1c1e;
    --card2:#2c2c2e;
    --label:#ffffff;
    --label2:rgba(235,235,245,.60);
    --label3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65);
    --fill:rgba(120,120,128,.24);
    --accent:#30d158;
    --accent-text:#ffffff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    background:var(--bg);
    color:var(--label);
    min-height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    display:flex;
    flex-direction:column;
  }
  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden{ display:none !important; }

  main{ flex:1; display:flex; flex-direction:column; overflow:hidden; padding:0 20px calc(14px + env(safe-area-inset-bottom)); }
  .screen{ flex:1; width:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; min-height:0; }
  #activeScreen{ justify-content:space-between; align-items:center; padding:10px 0 24px; }
  #doneScreen{ justify-content:center; align-items:center; gap:20px; }

  /* Large title nav (idle screen only) */
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 2px 18px; flex-shrink:0; }
  .large-title{ font-size:34px; font-weight:700; letter-spacing:.37px; margin:0; }
  .icon-btn{ width:34px; height:34px; border-radius:50%; border:none; background:var(--fill); color:var(--accent); display:flex; align-items:center; justify-content:center; padding:0; }
  .icon-btn svg{ width:18px; height:18px; }
  .icon-btn:active{ opacity:.6; }

  /* Cards / grouped list */
  .card{ background:var(--card); border-radius:14px; overflow:hidden; flex-shrink:0; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; gap:12px; }
  .list-row + .list-row{ border-top:0.5px solid var(--separator); }
  .row-label{ font-size:17px; color:var(--label); }
  .row-value{ font-size:17px; color:var(--label2); }

  .footnote{ font-size:13px; color:var(--label2); line-height:1.45; padding:8px 6px 0; }

  .spacer{ flex:1 1 auto; }

  /* Buttons */
  .btn{ appearance:none; border:none; border-radius:14px; padding:16px; font-size:17px; font-weight:600; cursor:pointer; width:100%; }
  .btn:active{ opacity:.75; }
  .btn-primary{ background:var(--accent); color:var(--accent-text); }

  .idle-cta{ flex-shrink:0; padding-bottom:6px; }

  /* Mouth diagram */
  .mouth-card{ width:100%; max-width:270px; padding:16px 8px 8px; display:flex; justify-content:center; }
  #mouthSvgIdle{ opacity:.6; }
  #mouthSvg, #mouthSvgIdle{ width:100%; height:auto; display:block; overflow:visible; }
  .band{ fill:var(--fill); stroke:var(--separator); stroke-width:1; transition:fill .35s ease; }
  .band.done{ fill:var(--label2); }
  .band.active{ fill:var(--accent); animation:bandPulse 1.8s ease-in-out infinite; }
  .is-paused .band.active{ animation-play-state:paused; opacity:1; }
  @keyframes bandPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.82; } }
  .jaw-label{ fill:var(--label3); font-size:11px; text-anchor:middle; letter-spacing:.05em; }

  .marker-halo{ fill:#fff; opacity:.4; animation:markerPulse 1.8s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  .is-paused .marker-halo{ animation-play-state:paused; opacity:0; }
  .marker-dot{ fill:#fff; stroke:var(--accent); stroke-width:2.5; }
  @keyframes markerPulse{ 0%{ transform:scale(.5); opacity:.5; } 70%{ transform:scale(2.4); opacity:0; } 100%{ opacity:0; } }

  .zone-title{ font-size:22px; font-weight:700; text-align:center; min-height:1.4em; padding:0 10px; }

  .paused-pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:20px; background:var(--fill); color:var(--label2); font-size:13px; font-weight:600; letter-spacing:.02em; }

  .ring-wrap{ position:relative; width:180px; height:180px; }
  .ring-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--fill); stroke-width:9; }
  .ring-progress{ fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .1s linear; }
  .ring-number{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-1px; }

  .dots{ display:flex; gap:7px; flex-shrink:0; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--card2); transition:background .3s, transform .3s; }
  .dot.done{ background:var(--label3); }
  .dot.current{ background:var(--accent); transform:scale(1.5); }

  /* Session controls (Clock-app style circular buttons) */
  .session-controls{ display:flex; justify-content:center; gap:30px; flex-shrink:0; }
  .circle-btn{ width:82px; height:82px; border-radius:50%; border:none; font-size:15px; font-weight:500; display:flex; align-items:center; justify-content:center; text-align:center; }
  .circle-btn:active{ opacity:.8; }
  .circle-btn.neutral{ background:var(--card2); color:var(--label); }
  .circle-btn.accent{ background:var(--accent); color:var(--accent-text); }

  /* Done screen */
  .check-circle{ color:var(--accent); }
  .check-circle svg{ width:72px; height:72px; }
  .done-subtitle{ font-size:15px; color:var(--label2); margin-top:-10px; }

  /* Settings sheet */
  #settingsPanel{ position:fixed; inset:0; z-index:30; }
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.5); }
  .sheet{ position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow:auto; }
  .sheet-grabber{ width:36px; height:5px; border-radius:3px; background:var(--card2); margin:6px auto 12px; }
  .sheet-nav{ position:relative; display:flex; align-items:center; justify-content:center; padding:2px 0 16px; }
  .sheet-title{ font-size:17px; font-weight:600; }
  .sheet-done-btn{ position:absolute; right:0; background:none; border:none; color:var(--accent); font-size:17px; font-weight:600; padding:4px 0; }
  .sheet-done-btn:active{ opacity:.6; }

  .stepper-row .row-right{ display:flex; align-items:center; gap:10px; }
  .stepper-capsule{ display:flex; align-items:center; background:var(--card2); border-radius:8px; overflow:hidden; }
  .stepper-capsule button{ width:32px; height:30px; border:none; background:transparent; color:var(--accent); font-size:19px; font-weight:600; line-height:1; padding:0; }
  .stepper-capsule button:active{ background:rgba(255,255,255,.08); }
  .stepper-capsule .stepper-divider{ width:1px; align-self:stretch; background:var(--separator); }
  #durationInput{ background:transparent; border:none; color:var(--label2); font-size:17px; text-align:right; width:34px; padding:0; -moz-appearance:textfield; }
  #durationInput::-webkit-outer-spin-button, #durationInput::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="idleScreen" class="screen">
      <div class="nav-row">
        <h1 class="large-title">Zahnputz</h1>
        <button id="settingsToggle" class="icon-btn" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="7.2" stroke-dasharray="2.1 2.4"></circle>
            <circle cx="12" cy="12" r="2.6"></circle>
          </svg>
        </button>
      </div>

      <div class="card mouth-card">
        <svg id="mouthSvgIdle" viewBox="0 0 300 280"></svg>
      </div>

      <div style="height:16px"></div>

      <div class="card">
        <div class="list-row">
          <span class="row-label">Gesamtdauer</span>
          <span class="row-value" id="totalDurationValue">3:00</span>
        </div>
      </div>
      <p class="footnote">6 Bereiche (Außen-, Innen- &amp; Kauflächen, oben &amp; unten) in zufälliger Reihenfolge, je <span id="hintDuration">30</span> Sekunden.</p>

      <div class="spacer"></div>

      <div class="idle-cta">
        <button id="startBtn" class="btn btn-primary">Start</button>
      </div>
    </section>

    <section id="activeScreen" class="screen hidden">
      <div class="dots" id="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="card mouth-card">
        <svg id="mouthSvg" viewBox="0 0 300 280"></svg>
      </div>

      <div class="zone-title" id="zoneTitle">—</div>
      <div class="paused-pill hidden" id="pausedOverlay">Pausiert</div>

      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="ring-number" id="countdownNumber">30</div>
      </div>

      <div class="session-controls">
        <button id="stopBtn" class="circle-btn neutral">Abbrechen</button>
        <button id="pauseBtn" class="circle-btn accent">Pause</button>
      </div>
    </section>

    <section id="doneScreen" class="screen hidden">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12.3l2.6 2.6L16 9.3"></path>
        </svg>
      </div>
      <div class="zone-title">Fertig geputzt!</div>
      <div class="done-subtitle">Gut gemacht.</div>
      <div style="height:8px"></div>
      <button id="restartBtn" class="btn btn-primary" style="width:auto; padding:16px 32px;">Nochmal</button>
    </section>
  </main>

  <div id="settingsPanel" class="hidden">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-nav">
        <span class="sheet-title">Einstellungen</span>
        <button id="closeSettingsBtn" class="sheet-done-btn">Fertig</button>
      </div>
      <div class="card">
        <div class="list-row stepper-row">
          <span class="row-label">Dauer pro Bereich</span>
          <div class="row-right">
            <input id="durationInput" type="number" min="5" max="180" step="5" value="30" inputmode="numeric"> <span class="row-value">s</span>
            <div class="stepper-capsule">
              <button id="decBtn" type="button" aria-label="Weniger">−</button>
              <div class="stepper-divider"></div>
              <button id="incBtn" type="button" aria-label="Mehr">+</button>
            </div>
          </div>
        </div>
      </div>
      <p class="footnote">Standard: 30 Sekunden pro Bereich.</p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ZONES = [
    { id:'front-lower', title:'Vorderseite unten',  jaw:'lower', part:'outer' },
    { id:'front-upper', title:'Vorderseite oben',   jaw:'upper', part:'outer' },
    { id:'back-lower',  title:'Hinterseite unten',  jaw:'lower', part:'inner' },
    { id:'back-upper',  title:'Hinterseite oben',   jaw:'upper', part:'inner' },
    { id:'top-upper',   title:'Obere Fläche oben',  jaw:'upper', part:'chew'  },
    { id:'top-lower',   title:'Obere Fläche unten', jaw:'lower', part:'chew'  }
  ];

  var RADII = { inner:[35,50], chew:[50,65], outer:[65,80] };
  var CX = 150, CY_UPPER = 110, CY_LOWER = 170;
  var RING_R = 54, RING_CIRC = 2 * Math.PI * RING_R;

  function $(id){ return document.getElementById(id); }

  function polar(cx, cy, r, angleDeg){
    var rad = angleDeg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function bandPathD(cx, cy, r1, r2, a1, a2){
    var pOuterStart = polar(cx, cy, r2, a1);
    var pOuterEnd   = polar(cx, cy, r2, a2);
    var pInnerEnd   = polar(cx, cy, r1, a2);
    var pInnerStart = polar(cx, cy, r1, a1);
    return [
      'M', pOuterStart.x, pOuterStart.y,
      'A', r2, r2, 0, 0, 1, pOuterEnd.x, pOuterEnd.y,
      'L', pInnerEnd.x, pInnerEnd.y,
      'A', r1, r1, 0, 0, 0, pInnerStart.x, pInnerStart.y,
      'Z'
    ].join(' ');
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs){
    var el = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function buildMouthDiagram(svg, withMarker){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var jaws = [
      { jaw:'upper', cy:CY_UPPER, a1:180, a2:360, labelY:16 },
      { jaw:'lower', cy:CY_LOWER, a1:0,   a2:180, labelY:266 }
    ];
    jaws.forEach(function(j){
      ['outer','chew','inner'].forEach(function(part){
        var r = RADII[part];
        var d = bandPathD(CX, j.cy, r[0], r[1], j.a1, j.a2);
        var path = svgEl('path', { d:d, class:'band', id: (svg.id + '-band-' + j.jaw + '-' + part) });
        svg.appendChild(path);
      });
      var label = svgEl('text', { x:CX, y:j.labelY, class:'jaw-label' });
      label.textContent = j.jaw === 'upper' ? 'Oberkiefer' : 'Unterkiefer';
      svg.appendChild(label);
    });
    if (withMarker){
      var marker = svgEl('g', { id:'brushMarker' });
      marker.appendChild(svgEl('circle', { class:'marker-halo', r:12 }));
      marker.appendChild(svgEl('circle', { class:'marker-dot', r:6 }));
      svg.appendChild(marker);
    }
  }

  buildMouthDiagram($('mouthSvgIdle'), false);
  buildMouthDiagram($('mouthSvg'), true);

  function bandEl(jaw, part){ return $('mouthSvg-band-' + jaw + '-' + part); }

  function updateBandStates(){
    var all = document.querySelectorAll('#mouthSvg .band');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active', 'done');
    for (var i = 0; i < state.index; i++){
      var doneZone = state.order[i];
      var doneEl = bandEl(doneZone.jaw, doneZone.part);
      if (doneEl) doneEl.classList.add('done');
    }
    var current = state.order[state.index];
    var el = bandEl(current.jaw, current.part);
    if (el) el.classList.add('active');
  }

  function updateBrushMarker(jaw, part, fraction){
    var cy = jaw === 'upper' ? CY_UPPER : CY_LOWER;
    var a1 = jaw === 'upper' ? 180 : 0;
    var a2 = jaw === 'upper' ? 360 : 180;
    var r = RADII[part];
    var rMid = (r[0] + r[1]) / 2;
    var t = Math.max(0, Math.min(1, fraction));
    var angle = a1 + t * (a2 - a1);
    var p = polar(CX, cy, rMid, angle);
    var marker = $('brushMarker');
    marker.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
  }

  var ringProgress = $('ringProgress');
  ringProgress.style.strokeDasharray = RING_CIRC;
  ringProgress.style.strokeDashoffset = 0;

  function fmtMinSec(totalSeconds){
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // ---- Settings ----
  var durationInput = $('durationInput');
  var duration = 30;
  try {
    var saved = localStorage.getItem('zahnputz_duration');
    if (saved) duration = parseInt(saved, 10) || 30;
  } catch (e) {}

  function clampDuration(v){
    v = Math.round(v / 5) * 5;
    if (v < 5) v = 5;
    if (v > 180) v = 180;
    return v;
  }

  function applyDuration(v){
    duration = clampDuration(v);
    durationInput.value = duration;
    $('totalDurationValue').textContent = fmtMinSec(duration * 6);
    $('hintDuration').textContent = duration;
    try { localStorage.setItem('zahnputz_duration', String(duration)); } catch (e) {}
  }
  applyDuration(duration);

  durationInput.addEventListener('change', function(){
    applyDuration(parseInt(durationInput.value, 10) || 30);
  });
  $('decBtn').addEventListener('click', function(){ applyDuration(duration - 5); });
  $('incBtn').addEventListener('click', function(){ applyDuration(duration + 5); });

  $('settingsToggle').addEventListener('click', function(){ $('settingsPanel').classList.remove('hidden'); });
  $('closeSettingsBtn').addEventListener('click', function(){ $('settingsPanel').classList.add('hidden'); });
  $('sheetBackdrop').addEventListener('click', function(){ $('settingsPanel').classList.add('hidden'); });

  // ---- Screens ----
  function showScreen(name){
    ['idleScreen','activeScreen','doneScreen'].forEach(function(id){
      $(id).classList.toggle('hidden', id !== name);
    });
  }
  showScreen('idleScreen');

  // ---- Feedback helpers ----
  function vibrate(pattern){
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  var audioCtx = null;
  function ensureAudioCtx(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    } else if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }
  function playBeep(){
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch (e) {}
  }

  var wakeLock = null;
  function requestWakeLock(){
    if ('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(wl){ wakeLock = wl; }).catch(function(){ wakeLock = null; });
    }
  }
  function releaseWakeLock(){
    if (wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && state.running && !state.paused) requestWakeLock();
  });

  // ---- Session state ----
  var state = {
    order: [], index: 0, duration: 30, elapsed: 0,
    paused: false, running: false, lastTs: null
  };
  var rafId = null;

  var dotsEls = document.querySelectorAll('#dots .dot');

  function resetDots(){
    dotsEls.forEach(function(d){ d.classList.remove('done', 'current'); });
  }
  function updateDots(){
    dotsEls.forEach(function(d, i){
      d.classList.toggle('done', i < state.index);
      d.classList.toggle('current', i === state.index);
    });
  }

  function enterZone(){
    var zone = state.order[state.index];
    $('zoneTitle').textContent = zone.title;
    updateBandStates();
    updateDots();
    vibrate(120);
    playBeep();
    renderTick();
  }

  function renderTick(){
    var remaining = Math.max(0, state.duration - state.elapsed);
    $('countdownNumber').textContent = Math.ceil(remaining);
    var frac = Math.min(1, state.elapsed / state.duration);
    ringProgress.style.strokeDashoffset = RING_CIRC * frac;
    var zone = state.order[state.index];
    updateBrushMarker(zone.jaw, zone.part, frac);
  }

  function advanceZone(){
    state.index++;
    if (state.index >= state.order.length){
      finishSession();
      return;
    }
    state.elapsed = 0;
    enterZone();
  }

  function loop(ts){
    if (!state.running) return;
    if (state.paused){
      state.lastTs = ts;
      rafId = requestAnimationFrame(loop);
      return;
    }
    if (state.lastTs === null) state.lastTs = ts;
    var dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    state.elapsed += dt;
    if (state.elapsed >= state.duration){
      advanceZone();
    } else {
      renderTick();
    }
    if (state.running) rafId = requestAnimationFrame(loop);
  }

  function startSession(){
    ensureAudioCtx();
    state.duration = duration;
    state.order = shuffle(ZONES.slice());
    state.index = 0;
    state.elapsed = 0;
    state.paused = false;
    state.lastTs = null;
    state.running = true;
    $('pauseBtn').textContent = 'Pause';
    $('pausedOverlay').classList.add('hidden');
    $('activeScreen').classList.remove('is-paused');
    resetDots();
    showScreen('activeScreen');
    enterZone();
    requestWakeLock();
    rafId = requestAnimationFrame(loop);
  }

  function stopSession(){
    state.running = false;
    if (rafId) cancelAnimationFrame(rafId);
    releaseWakeLock();
    showScreen('idleScreen');
  }

  function finishSession(){
    state.running = false;
    if (rafId) cancelAnimationFrame(rafId);
    releaseWakeLock();
    vibrate([100, 60, 100, 60, 200]);
    playBeep();
    showScreen('doneScreen');
  }

  function togglePause(){
    state.paused = !state.paused;
    $('pauseBtn').textContent = state.paused ? 'Weiter' : 'Pause';
    $('pausedOverlay').classList.toggle('hidden', !state.paused);
    $('activeScreen').classList.toggle('is-paused', state.paused);
    if (!state.paused) state.lastTs = null;
  }

  $('startBtn').addEventListener('click', startSession);
  $('pauseBtn').addEventListener('click', togglePause);
  $('stopBtn').addEventListener('click', stopSession);
  $('restartBtn').addEventListener('click', startSession);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
